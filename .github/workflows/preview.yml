name: Preview

# Every pull request gets its own throwaway URL, so you can open the change on
# your phone before it goes anywhere near the live site.

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write # so the bot can post the link as a comment

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

env:
  FIREBASE_PROJECT: free-lab-finder

jobs:
  preview:
    name: Check and preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # pull requests from someone else's fork cannot read secrets, so skip those
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the build
        run: python check_build.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the Firebase CLI
        run: npm install -g firebase-tools

      - name: Unlock Firebase
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "The FIREBASE_SERVICE_ACCOUNT secret is missing or empty."
            exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"

      - name: Put it on a temporary URL
        id: deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          firebase hosting:channel:deploy "pr-${{ github.event.number }}" \
            --project "$FIREBASE_PROJECT" \
            --expires 7d \
            --non-interactive \
            --json > channel.json
          URL=$(python -c "
          import json
          d = json.load(open('channel.json'))['result']
          print(next(iter(d.values()))['url'])
          ")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo "### Preview"
            echo ""
            echo "$URL"
            echo ""
            echo "Expires in 7 days."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post the link on the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          gh pr comment "${{ github.event.number }}" --edit-last --create-if-none --body \
            "Preview ready: $URL

          Expires in 7 days. Updated on every push to this branch."

      - name: Shred the key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json" channel.json
